[project]
name = "pyrometer"
version = "0.1.0"
description = "Self-hosted PyTorch experiment dashboard with integrated GPU profiling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "duckdb>=1.1",
    "httpx>=0.28",
    "nvidia-ml-py>=12.0",
    "torch>=2.10.0",
    "aiofiles>=24.1",
    "numpy>=2.4.3",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.1",
    "pillow>=12.1.1",
]

[project.scripts]
pyrometer = "pyrometer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
