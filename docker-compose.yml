# Pyrometer server. Auth is required: create a key after the first start with
#   docker compose exec pyrometer python -m pyrometer keys create --name <name> --scopes ingest
services:
  pyrometer:
    build: .
    image: pyrometer:local
    container_name: pyrometer
    restart: unless-stopped
    user: "1000:1000"
    environment:
      PYROMETER_DB_PATH: /data/data.duckdb      # DuckDB file
      PYROMETER_KEYS_FILE: /data/keys.json      # hashed API keys
      # PYROMETER_TRUSTED_PROXIES: 172.16.0.0/12 # set when an auth proxy (e.g. authentik) is in front
    volumes:
      - ./data:/data                             # must be writable by uid 1000
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8321:8321"                    # localhost only; change to expose on your LAN
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8321/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
