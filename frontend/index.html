<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyrometer</title>
    <meta name="theme-color" content="#17130f" />
      <script>try{var q=new URLSearchParams(location.search).get('theme');if(q)localStorage.setItem('pyrometer.theme',q);var t=localStorage.getItem('pyrometer.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
